name: Build site

# Збирає HTML-сторінки (послуги, блог, sitemap) з tools/ і content/
# після кожного оновлення в main, а також щодня – для відкладених статей.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "tools/**"
      - ".github/workflows/build-site.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 -B tools/build.py
      - name: Commit generated pages
        id: commit
        run: |
          git config user.name "perseus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-build: оновлення сторінок і sitemap"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
